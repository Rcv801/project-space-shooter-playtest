<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Project Space Shooter</title>
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Space Shooter">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="theme-color" content="#000000">
		<link rel="manifest" href="manifest.webmanifest">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}
html, body {
	width: 100%;
	height: 100%;
	min-height: 100dvh;
	margin: 0;
	padding: 0;
	position: fixed;
	overflow: hidden;
	overscroll-behavior: none;
	background: #000;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
}

#canvas {
	width: 100vw !important;
	height: 100dvh !important;
	padding-left: env(safe-area-inset-left);
	padding-right: env(safe-area-inset-right);
	padding-top: env(safe-area-inset-top);
	padding-bottom: env(safe-area-inset-bottom);
	box-sizing: border-box;
	touch-action: none;
}

#ios-fullscreen-hint, #windows-link {
	position: fixed;
	z-index: 1000;
	padding: 8px 12px;
	border: 1px solid rgba(120, 235, 255, 0.55);
	border-radius: 12px;
	background: rgba(0, 8, 18, 0.76);
	color: #dffbff;
	font: 600 13px/1.25 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
	box-shadow: 0 0 24px rgba(0, 190, 255, 0.24);
	text-decoration: none;
}
#ios-fullscreen-hint { top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); max-width: 310px; }
#windows-link { bottom: 10px; left: 10px; opacity: 0.75; }
#windows-link:hover { opacity: 1; }

@media (display-mode: fullscreen), (display-mode: standalone) {
	#ios-fullscreen-hint, #windows-link { display: none; }
}


#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #03060d;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14100432,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	<script>
(function () {
  function isStandalone() {
    return window.matchMedia('(display-mode: fullscreen)').matches ||
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;
  }
  function isTouch() { return navigator.maxTouchPoints > 0 || 'ontouchstart' in window; }
  function ensureFullscreenHint() {
    if (isStandalone() || document.getElementById('ios-fullscreen-hint')) return;
    var isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!isiOS) return;
    var hint = document.createElement('button');
    hint.id = 'ios-fullscreen-hint';
    hint.type = 'button';
    hint.textContent = 'Fullscreen on iPhone/iPad: Share → Add to Home Screen.';
    hint.addEventListener('click', function () { hint.remove(); focusGodotCanvas(); });
    document.body.appendChild(hint);
    setTimeout(function () { if (hint.parentNode) hint.remove(); }, 12000);
  }
  function ensureWindowsLink() {
    if (isTouch() || isStandalone() || document.getElementById('windows-link')) return;
    var a = document.createElement('a');
    a.id = 'windows-link';
    a.href = 'ProjectSpaceShooter-Windows.zip';
    a.textContent = 'Download Windows build (.zip)';
    document.body.appendChild(a);
  }
  function focusGodotCanvas() {
    var canvas = document.querySelector('canvas');
    if (!canvas) return;
    canvas.setAttribute('tabindex', '0');
    try { canvas.focus({ preventScroll: true }); } catch (e) { canvas.focus(); }
  }
  window.addEventListener('load', function () {
    ensureFullscreenHint();
    ensureWindowsLink();
    focusGodotCanvas();
    setTimeout(focusGodotCanvas, 100);
    setTimeout(focusGodotCanvas, 1000);
  });
  ['pointerdown', 'touchstart', 'mousedown', 'click', 'keydown'].forEach(function (eventName) {
    window.addEventListener(eventName, focusGodotCanvas, { capture: true, passive: true });
  });
})();
</script>
</body>
</html>
